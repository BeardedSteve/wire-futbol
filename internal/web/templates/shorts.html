{{define "shorts"}}<!doctype html><html lang="en-GB" data-now="{{.Now}}"><head>
{{template "head" .}}<meta name="robots" content="noindex">
<link rel="preconnect" href="https://www.youtube.com"><link rel="preconnect" href="https://i.ytimg.com"><link rel="stylesheet" href="{{asset "shorts.css"}}">
<script src="{{asset "wire.js"}}" defer></script><script src="{{asset "shorts.js"}}" defer></script>
</head><body class="sh-body" data-pages="{{.Pages}}">
<a class="skip" href="#sh-controls">Skip to controls</a>
{{template "titleblock" .}}
<div class="sh-meter" id="sh-meter" role="progressbar" aria-label="Shorts seen this visit" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span id="sh-fill"></span></div>
<div class="sh-head">
  <h1 class="sh-h"><a class="sh-back" href="/" aria-label="Back to the wire"><b>100</b>Wire</a><span>Shorts</span> <span class="sh-n" id="sh-n"></span></h1>
  <button type="button" class="sh-all" id="sh-all" disabled>{{icon "checks"}}<span>Mark all seen</span></button>
</div>
<main id="main" class="sh-stage">
  <div class="sh-player" id="sh-player" data-channels="{{.Data}}">
    <div class="sh-slot" id="sh-slot"><div class="sh-card sh-skel" aria-label="Loading Shorts"></div></div>
    <div class="sh-controls" id="sh-controls" role="toolbar" aria-label="Shorts controls">
      <button type="button" class="sh-btn" id="sh-undo" disabled>{{icon "undo"}}<span>Undo</span></button>
      <button type="button" class="sh-btn" id="sh-skip" disabled>{{icon "down"}}<span>Skip</span></button>
      <button type="button" class="sh-btn primary" id="sh-seen" disabled>{{icon "up"}}<span>Seen</span></button>
    </div>
    <div class="sh-toast" id="sh-toast" role="status" hidden><span id="sh-toast-t"></span></div>
  </div>
</main>
<p class="sh-keys" aria-hidden="true"><span><kbd>Up</kbd>seen</span><span><kbd>Down</kbd>skip</span><span><kbd>M</kbd>sound</span><span><kbd>Space</kbd>pause</span><span><kbd>U</kbd>undo</span></p>
<div class="sr-only" id="sh-live" aria-live="polite"></div>
<noscript><p class="sh-noscript">Shorts needs JavaScript to play videos.</p></noscript>
{{template "tabbar" .}}
</body></html>{{end}}
